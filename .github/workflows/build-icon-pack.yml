name: Build icon pack release

# Builds the runtime icon-pack zip (catalog.json + rasterized icons) from the
# IconPack submodule, exactly as GenerateIconPackTask renders them, and
# publishes it as a GitHub release (tag icon-pack-v1).
#
# Slim builds (-PslimIconPacks, the default) bake neither the pack's launcher
# aliases nor its icons into the APK; the app downloads this zip on demand the
# first time the user opens the app-icon customization screen
# (see IconPackRuntimeManager.kt).

on:
  workflow_dispatch:
  push:
    branches: [ 'dev' ]
    paths:
      - '.github/workflows/build-icon-pack.yml'
      - 'IconPack/**'
      - 'buildSrc/src/main/kotlin/GenerateIconPackTask.kt'

permissions:
  contents: write

jobs:
  build:
    name: Build icon pack zip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ArchiveTune (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sfLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Generate icon pack
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          ./gradlew :app:generateDebugIconPack -PslimIconPacks=false --no-daemon

      - name: Pack release zip
        run: |
          OUT="$RUNNER_TEMP/icon-pack-out"
          rm -rf "$OUT" && mkdir -p "$OUT/icon_pack/drawables"
          ASSETS="app/build/generated/iconPack/debug/assets/icon_pack"
          RES="app/build/generated/iconPack/debug/res"
          cp "$ASSETS/catalog.json" "$OUT/icon_pack/catalog.json"
          cp "$RES"/drawable-nodpi/icon_pack_*.png "$OUT/icon_pack/drawables/"
          (cd "$OUT" && zip -q -r -9 "$RUNNER_TEMP/icon-pack-v1.zip" icon_pack)
          sha256sum "$RUNNER_TEMP/icon-pack-v1.zip" | tee "$OUT/icon-pack-v1.zip.sha256"
          cp "$OUT/icon-pack-v1.zip.sha256" "$RUNNER_TEMP/"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: icon-pack-v1
          path: ${{ runner.temp }}/icon-pack-v1.zip
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="icon-pack-v1"
          gh release view "$TAG" --json assets >/dev/null 2>&1 && \
            gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Runtime icon pack ($TAG)" \
            --notes "Icon-pack runtime download payload (generated by GenerateIconPackTask from the IconPack submodule).
          Zip layout: icon_pack/catalog.json + icon_pack/drawables/icon_pack_<hash>.png.
          Downloaded on demand by the app (IconPackRuntimeManager.kt), digest in icon-pack-v1.zip.sha256." \
            "$RUNNER_TEMP/icon-pack-v1.zip" \
            "$RUNNER_TEMP/icon-pack-v1.zip.sha256"
