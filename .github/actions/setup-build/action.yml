name: 'Set up build environment'
description: >-
  JDK 21 + Gradle (user-home cache, build cache, configuration cache with
  encryption) + Android NDK cache + incremental native (CXX) build cache.
  One shared setup for every build workflow so the caching rules can never
  drift apart between them.
inputs:
  variant-key:
    description: >-
      Stable key for this job's build variant (flavor/device/abi) — keys the
      native .cxx cache so matrix jobs never fight over the same entry.
    required: false
    default: 'default'
  cache-read-only:
    description: 'Whether the Gradle user-home cache is read-only for this job.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # setup-gradle persists the whole Gradle User Home (~/.gradle/caches:
    # dependencies, artifact transforms AND the local build cache) in the
    # GitHub Actions cache. Combined with org.gradle.caching=true in
    # gradle.properties this acts as a shared remote build cache — compiled
    # classes, resource merges and R8 output become reusable across jobs and
    # pushes instead of every job recompiling from scratch.
    #
    # The encryption key allows the CONFIGURATION cache to be persisted as
    # well (Gradle refuses to cache it unencrypted); entries only ever live
    # inside this repository's Actions cache, which already requires write
    # access to read.
    - name: Set Up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ inputs.cache-read-only }}
        cache-encryption-key: OxTF9knZQyhA/VF7346/EO6IaU+WZ4yz+A1LdjW0y34=

    # AGP resolves its default NDK version from the AGP/Gradle versions; when
    # the runner image's preinstalled NDK doesn't match, every job re-downloads
    # and re-extracts ~1GB. Cache the installed tree keyed on the version
    # inputs that actually decide the NDK version.
    - name: Cache Android NDK
      uses: actions/cache@v4
      with:
        path: /usr/local/lib/android/sdk/ndk
        key: ndk-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ndk-${{ runner.os }}-

    # The C++ engines (Tryptify/LastWave/automix DSP) rebuild from scratch in
    # every job — setup-gradle does not see project build directories. Ninja
    # is incremental: with the .cxx tree restored only changed sources
    # recompile. Keyed per variant so matrix jobs don't thrash one entry, with
    # a prefix restore key so source changes still reuse most objects.
    - name: Cache native (CXX) build output
      uses: actions/cache@v4
      with:
        path: app/build/.cxx
        key: cxx-${{ inputs.variant-key }}-${{ hashFiles('app/src/main/cpp/**') }}
        restore-keys: |
          cxx-${{ inputs.variant-key }}-

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x gradlew
